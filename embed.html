<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Icelus sketch</title>
    <style>
      :root { color-scheme: light dark; --ink: #1d1d1f; --muted: rgba(29, 29, 31, 0.6); --bg: #fff; --accent: #1D4ED8; }
      @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f7; --muted: rgba(245, 245, 247, 0.6); --bg: #000; --accent: #5B9BFF; } }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body { font: 13px/18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 16px; }
      pre { margin: 0 0 8px; font: 14px/1 ui-monospace, "SF Mono", Menlo, monospace; overflow-x: auto; }
      a { color: var(--accent); text-decoration: none; }
      p { margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <pre id="sketch" aria-label="Wireframe"></pre>
    <p><a id="open" href="./" target="_blank" rel="noopener">Open in Icelus</a></p>
    <script type="module" src="/src/embed.js"></script>
  </body>
</html>
